# =====================================================================
# Sacrum single-IMU baseline — reproduction of the prior-literature setup
# =====================================================================
# A sacrum single-IMU baseline reimplemented on the same dataset, for a direct
# comparison against the proposed wrist-based model (Section III-B).
#
# Differences from the proposed model:
#   body_parts        : L_Wrist          -> sacrum      (sensor location)
#   use_modeling_input: True             -> False       (CoM aux removed)
#   model.type        : binn             -> cnn         (single branch)
#
# Input features (in_dim = 7):
#   idx 0,1,2 : sacrum imu_acc_local  x, y, z
#   idx 3,4,5 : sacrum imu_gyro_local x, y, z
#   idx 6     : stride duration scalar
#
# Parameter count: 111,788 (exactly matching the proposed binn/proposed model)
#   channels [81,170,72] / kernels [9,5,3] / in_dim 7 / out_dim 2
#   shrunk while keeping the expand-contract shape of the paper's CNN baseline [128,256,128]
#
# Run:
#   python sweep.py --config config_sacrum_baseline.yaml \
#     --data_variants full_day1 percent050_day1_case1 percent020_day1_case1 \
#                     percent010_day1_case1 percent005_day1_case1
#   -> 5 data x 7 session = 35 runs
# =====================================================================

run:
  name: "sacrum_baseline"
  output_dir: "./runs"
  device: "cuda"
  seeds: [98]
  epochs: 200
  batch_size: 16
  lr: 0.001
  weight_decay: 0
  save_checkpoints: True
  viz_seed: 98
  num_workers: 2

split:
  mode: "loso"
  fixed_val_subjects: ["S010","S019"]
  fixed_test_subjects: ["S009","S018"]

# default data = full_day1 (overwritten by data_variants during a sweep)
data:
  grf_mat: "../data/merged_stride_grf_gyro_day1.mat"
  grf_struct: "stride_grf"
  kin_mat: "../data/merged_stride_kinematics_arm_gyro_day1.mat"
  kin_struct: "stride_kinematics_arm"
  modeling_mat: "../data/manual_stride_modeling_grfNEW_day1.mat"
  modeling_struct: "stride_modeling"

dataset:
  train_val_sessions: ["ss1"]
  test_sessions: ["ss1"]

  grf_sides: ["Total"]
  grf_axes: ["Fx","Fz"]

  # sacrum IMU instead of the wrist
  body_parts: ["sacrum"]

  axes_pos: []
  axes_vel: []
  axes_acc: []

  # 6-axis local IMU (same layout as the proposed model)
  axes_imu_acc_local: ["x","y","z"]
  axes_imu_gyro_local: ["x","y","z"]
  axes_imu_acc_global: []
  axes_imu_gyro_global: []

  add_stride_duration_scalar: True
  window_mode: "percent"
  win_pct: [0.0, 100.0]
  win_time: [0.0, 0]

  # no CoM auxiliary input (sacrum-IMU-only baseline)
  use_modeling_input: False
  modeling_points_to_use: []
  modeling_fields_to_use: []

model:
  type: "cnn"

  cnn:
    channels: [81, 170, 72]   # -> 111,788 params (in_dim=7, out_dim=2)
    kernels:  [9,  5,   3]
    dropout: 0.1              # tune_cnn_results_250000to350000.csv best trial

visualization:
  loso_mean_std:
    channels_to_plot: [0, 1]

viz:
  enable_val_curves: True
  out_dir: "./runs/plots"
  title: "Sacrum IMU baseline — LOSO Validation NRMSE (mean ± sd)"
  loso_mean_std:
    channels_to_plot: [0, 1]
    trials_include: []
    save_dir: "./runs/plots"

# =====================================================================
# sweep: 35 combinations (5 data x 7 session)
# Of the original 43 data_variants, only the 5 day1/case1 variants whose .mat
# files actually exist are kept.
# =====================================================================
sweep:
  data_variants:
    - name: full_day1
      data: {grf_mat: ../data/merged_stride_grf_gyro_day1.mat, grf_struct: stride_grf, kin_mat: ../data/merged_stride_kinematics_arm_gyro_day1.mat, kin_struct: stride_kinematics_arm, modeling_mat: ../data/manual_stride_modeling_grfNEW_day1.mat, modeling_struct: stride_modeling}
    - name: percent050_day1_case1
      data: {grf_mat: ../data/merged_stride_grf_050_day1_case1.mat, grf_struct: stride_grf, kin_mat: ../data/merged_stride_kinematics_arm_050_day1_case1.mat, kin_struct: stride_kinematics_arm, modeling_mat: ../data/manual_stride_modeling_grfNEW_050_day1_case1.mat, modeling_struct: stride_modeling}
    - name: percent020_day1_case1
      data: {grf_mat: ../data/merged_stride_grf_020_day1_case1.mat, grf_struct: stride_grf, kin_mat: ../data/merged_stride_kinematics_arm_020_day1_case1.mat, kin_struct: stride_kinematics_arm, modeling_mat: ../data/manual_stride_modeling_grfNEW_020_day1_case1.mat, modeling_struct: stride_modeling}
    - name: percent010_day1_case1
      data: {grf_mat: ../data/merged_stride_grf_010_day1_case1.mat, grf_struct: stride_grf, kin_mat: ../data/merged_stride_kinematics_arm_010_day1_case1.mat, kin_struct: stride_kinematics_arm, modeling_mat: ../data/manual_stride_modeling_grfNEW_010_day1_case1.mat, modeling_struct: stride_modeling}
    - name: percent005_day1_case1
      data: {grf_mat: ../data/merged_stride_grf_005_day1_case1.mat, grf_struct: stride_grf, kin_mat: ../data/merged_stride_kinematics_arm_005_day1_case1.mat, kin_struct: stride_kinematics_arm, modeling_mat: ../data/manual_stride_modeling_grfNEW_005_day1_case1.mat, modeling_struct: stride_modeling}

  dataset_variants:
    - name: "tv_te_ss123"
      dataset: {train_val_sessions: ["ss1","ss2","ss3"], test_sessions: ["ss1","ss2","ss3"]}
    - name: "tv_te_ss1"
      dataset: {train_val_sessions: ["ss1"], test_sessions: ["ss1"]}
    - name: "tv_te_ss2"
      dataset: {train_val_sessions: ["ss2"], test_sessions: ["ss2"]}
    - name: "tv_te_ss3"
      dataset: {train_val_sessions: ["ss3"], test_sessions: ["ss3"]}
    - name: "tv_ss3__te_ss1ss2"
      dataset: {train_val_sessions: ["ss3"], test_sessions: ["ss1","ss2"]}
    - name: "tv_ss2__te_ss1ss3"
      dataset: {train_val_sessions: ["ss2"], test_sessions: ["ss1","ss3"]}
    - name: "tv_ss1__te_ss2ss3"
      dataset: {train_val_sessions: ["ss1"], test_sessions: ["ss2","ss3"]}
