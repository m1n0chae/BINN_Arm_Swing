# =====================================================================
# 트랙 A — CoM auxiliary input ablation (AP / VT)
# =====================================================================
# 리뷰 대응: "CoM VT, AP Auxiliary Input 을 각각 하나씩 없애는 ablation"
#
# ablation_mode is fixed to binn (the proposed full architecture),
# dataset.modeling_fields_to_use 만 바꾼다.  acc_x = AP,  acc_z = VT
#
#   auxAPVT : ["acc_x","acc_z"]  -> sacrum_dim 2, in_dim 9  (기준선 = Proposed)
#   auxAP   : ["acc_x"]          -> sacrum_dim 1, in_dim 8  (VT 제거)
#   auxVT   : ["acc_z"]          -> sacrum_dim 1, in_dim 8  (AP 제거)
#   (in_dim = wrist 6 + sacrum + stride duration 1)
#
# ※ sacrum_dim / wrist_dim 은 main.py 가 dataset 설정에서 자동 유도해
#   덮어쓰므로 아래 binn 의 값은 참고용이다.
#   (수동으로 두면 채널이 어긋나도 예외 없이 잘못 학습됨)
#
# 실행: python sweep.py --config config_aux_ablation.yaml
#       -> 5 data x 21 dataset(7 session x 3 aux) = 105 runs
# =====================================================================
run:
  name: speed_loso
  output_dir: ./runs
  device: cuda
  seeds:
  - 98
  epochs: 200
  batch_size: 16
  lr: 0.001
  weight_decay: 0
  save_checkpoints: true
  viz_seed: 98
  num_workers: 2
split:
  mode: loso
data:
  grf_mat: ../data/merged_stride_grf_gyro_day1.mat
  grf_struct: stride_grf
  kin_mat: ../data/merged_stride_kinematics_arm_gyro_day1.mat
  kin_struct: stride_kinematics_arm
  modeling_mat: ../data/manual_stride_modeling_grfNEW_day1.mat
  modeling_struct: stride_modeling
dataset:
  train_val_sessions:
  - ss1
  test_sessions:
  - ss1
  grf_sides:
  - Total
  grf_axes:
  - Fx
  - Fz
  body_parts:
  - L_Wrist
  axes_pos: []
  axes_vel: []
  axes_acc: []
  axes_imu_acc_local:
  - x
  - y
  - z
  axes_imu_gyro_local:
  - x
  - y
  - z
  axes_imu_acc_global: []
  axes_imu_gyro_global: []
  add_stride_duration_scalar: true
  window_mode: percent
  win_pct:
  - 0.0
  - 100.0
  win_time:
  - 0.0
  - 0
  use_modeling_input: true
  modeling_points_to_use:
  - sacrum
  modeling_fields_to_use:
  - acc_x
  - acc_z
model:
  type: binn
  binn:
    ablation_mode: proposed
    wrist_dim: 6
    sacrum_dim: 2
    embed_dim: 40
    attn_heads: 2
    dropout: 0.05
    wrist_channels:
    - 48
    - 48
    wrist_kernels:
    - 9
    - 5
    sacrum_channels:
    - 24
    - 24
    sacrum_kernels:
    - 9
    - 5
    decoder_channels:
    - 112
    - 56
    decoder_kernels:
    - 7
    - 3
    decoder_channels_by_mode:
      proposed:
      - 112
      - 56
      no_converter:
      - 112
      - 56
      phys_to_attn:
      - 112
      - 56
      attn_only:
      - 116
      - 52
      no_attn:
      - 136
      - 132
      no_physics_enc:
      - 76
      - 64
      no_attn_enc:
      - 92
      - 136
    phys_smooth_kernel: 5
    phys_scale_init: 1
    include_phys_in_residual: true
    extra_to_wrist: true
    save_physics_output: true
visualization:
  loso_mean_std:
    channels_to_plot:
    - 0
    - 1
viz:
  enable_val_curves: true
  out_dir: ./runs/plots
  title: LOSO Validation NRMSE (mean ± sd)
  loso_mean_std:
    channels_to_plot:
    - 0
    - 1
    trials_include: []
    save_dir: ./runs/plots
sweep:
  data_variants:
  - name: full_day1
    data:
      grf_mat: ../data/merged_stride_grf_gyro_day1.mat
      grf_struct: stride_grf
