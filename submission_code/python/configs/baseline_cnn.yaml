# baseline_cnn
# CNN baseline (wrist IMU only)
#
# Reproduces the corresponding row of Table II in the paper.
# Source run: 20260516-021413_seed98_loso_speed_loso__cnn__full_day1__tv_te_ss123
# LOSO over 19 subjects, seed 98, 200 epochs, AdamW, MSE, last-epoch weights.
run:
  name: speed_loso__cnn__full_day1__tv_te_ss123
  output_dir: ./day1_output
  device: cuda
  seeds:
  - 98
  epochs: 200
  batch_size: 16
  lr: 0.001
  weight_decay: 0
  save_checkpoints: true
  viz_seed: 98
  num_workers: 2
split:
  mode: loso
  fixed_val_subjects:
  - S010
  - S019
  fixed_test_subjects:
  - S009
  - S018
data:
  grf_mat: ../data/merged_stride_grf_gyro_day1.mat
  grf_struct: stride_grf
  kin_mat: ../data/merged_stride_kinematics_arm_gyro_day1.mat
  kin_struct: stride_kinematics_arm
  modeling_mat: ../data/manual_stride_modeling_grfNEW_day1.mat
  modeling_struct: stride_modeling
dataset:
  train_val_sessions:
  - ss1
  - ss2
  - ss3
  test_sessions:
  - ss1
  - ss2
  - ss3
  grf_sides:
  - Total
  grf_axes:
  - Fx
  - Fz
  body_parts:
  - L_Wrist
  axes_pos: []
  axes_vel: []
  axes_acc: []
  axes_imu_acc_local:
  - x
  - y
  - z
  axes_imu_gyro_local:
  - x
  - y
  - z
  axes_imu_acc_global: []
  axes_imu_gyro_global: []
  add_stride_duration_scalar: true
  window_mode: percent
  win_pct:
  - 0.0
  - 100.0
  win_time:
  - 0.0
  - 0
  use_modeling_input: false
  modeling_points_to_use:
  - sacrum
  modeling_fields_to_use:
  - acc_x
  - acc_z
model:
  type: cnn
  cnn:
    channels:
    - 128
    - 256
    - 128
    kernels:
    - 5
    - 5
    - 3
    dropout: 0.1
visualization:
  loso_mean_std:
    channels_to_plot:
    - 0
    - 1
viz:
  enable_val_curves: true
  out_dir: ./runs/plots
  title: LOSO Validation NRMSE (mean ± sd)
  loso_mean_std:
    channels_to_plot:
    - 0
    - 1
    trials_include: []
    save_dir: ./runs/plots
